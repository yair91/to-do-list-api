name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validar formato de la etiqueta
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::la etiqueta $GITHUB_REF_NAME no tiene formato v#.#.#"
            exit 1
          fi

      - name: Empaquetar el repositorio
        run: |
          git archive --format=zip \
            --prefix="to-do-list-api-${GITHUB_REF_NAME}/" \
            -o "to-do-list-api-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"
          ls -lh *.zip

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "to-do-list-api-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
